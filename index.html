<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nébula</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--eye:#f7d9e4;--ew:min(24vw,36vh)}
html,body{height:100%;margin:0;background:#000;color:#eee;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#face{position:relative;display:flex;flex-direction:column;align-items:center;gap:calc(var(--ew)*.22)}
#eyes{position:relative;display:flex;gap:14%;transition:transform .25s}
#mouth{height:calc(var(--ew)*.4);display:flex;justify-content:center}
#mouth::before{content:"";display:none}
body[data-m=happy] #mouth::before,body[data-m=carinho] #mouth::before{display:block;width:calc(var(--ew)*.5);height:calc(var(--ew)*.2);border-bottom:5px solid var(--eye);border-radius:0 0 50% 50%}
body[data-m=angry] #mouth::before{display:block;width:calc(var(--ew)*.18);height:calc(var(--ew)*.18);border-left:5px solid #ffb3b3;border-top:5px solid #ffb3b3;transform:rotate(45deg);margin-top:8px}
body[data-m=sad] #mouth::before{display:block;width:calc(var(--ew)*.3);height:calc(var(--ew)*.14);border-top:5px solid #b9c9ff;border-radius:50% 50% 0 0;margin-top:8px}
body[data-m=cry] #mouth::before{display:block;width:calc(var(--ew)*.5);height:calc(var(--ew)*.3);background:#8fd3ff;border-radius:6px 6px 50% 50%}
body[data-m=curious] #mouth::before,body[data-m=surprised] #mouth::before{display:block;width:calc(var(--ew)*.14);height:calc(var(--ew)*.14);border:4px solid var(--eye);border-radius:50%}
#sym{position:absolute;left:50%;top:-48%;transform:translateX(-50%);font-size:calc(var(--ew)*.5);display:none;font-style:normal}
body[data-m=angry] #sym{display:block}
.bl{position:absolute;bottom:-14%;width:calc(var(--ew)*.5);height:calc(var(--ew)*.2);background:#ff8fb3;border-radius:50%;opacity:0;transition:opacity .3s}
.bl.a{left:-8%}.bl.b{right:-8%}
body[data-m=happy] .bl,body[data-m=carinho] .bl{opacity:.55}
#eyes.wig{animation:wig .15s infinite}
@keyframes wig{25%{transform:translateX(-8px) rotate(-4deg)}75%{transform:translateX(8px) rotate(4deg)}}
@keyframes around{0%,100%{transform:translateX(-22px)}50%{transform:translateX(22px)}}
@keyframes trem{50%{transform:translate(3px,-2px)}}
.eye{position:relative;width:var(--ew);height:calc(var(--ew)*1.15);background-color:var(--eye);background-image:radial-gradient(circle at 30% 26%,#fff 0 8%,transparent 9%);border-radius:50%;overflow:hidden;transition:all .25s;transform:scaleY(var(--blink,1))}
.eye::before{content:"";position:absolute;left:-30%;width:160%;top:-5%;height:var(--lt,0%);background:#000;transform:rotate(calc(var(--lr,0deg)*var(--s)));transform-origin:center top;transition:all .25s}
.eye.l{--s:1}.eye.r{--s:-1}
.eye::after{content:"";position:absolute;left:-20%;width:140%;height:100%;top:var(--ht,110%);background:#000;border-radius:50%;transition:all .25s}
body[data-m=happy] .eye{--ht:52%}
body[data-m=angry] .eye{--lt:55%;--lr:24deg;background-color:#ffb3b3}
body[data-m=sad] .eye,body[data-m=cry] .eye{--lt:50%;--lr:-22deg;background-color:#b9c9ff}
body[data-m=cry] .eye{--lt:58%}
body[data-m=sleepy] .eye{--lt:62%}
body[data-m=curious] .eye{transform:scale(1.1)}
body[data-m=curious] #eyes{animation:around 2.4s ease-in-out infinite}
body[data-m=scared] .eye{transform:scale(.85);background-color:#e8e4ff}
body[data-m=scared] #eyes{animation:trem .1s infinite}
body[data-m=carinho] .eye{background:transparent;display:flex;align-items:center;justify-content:center;font-size:var(--ew);animation:beat .6s infinite}
body[data-m=carinho] .eye::before,body[data-m=carinho] .eye::after,body[data-m=dizzy] .eye::before,body[data-m=dizzy] .eye::after{display:none}
body[data-m=dizzy] .eye{animation:spin .5s linear infinite;background:repeating-radial-gradient(circle,#f7d9e4 0 6px,#000 6px 12px)}
@keyframes beat{50%{transform:scale(1.15)}}@keyframes spin{to{transform:rotate(360deg)}}
#bubble{position:fixed;top:calc(env(safe-area-inset-top,0px) + 18px);left:0;right:0;text-align:center;font-size:17px;opacity:0;transition:opacity .4s;pointer-events:none}
#bubble.on{opacity:.85}
#bar{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:0;right:0;display:flex;justify-content:center;gap:8px}
#bar button{background:#ffffff14;color:#fff;border:0;border-radius:22px;padding:10px 12px;font-size:15px}
#estado{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#1b1824f2;border-radius:20px;padding:18px 22px;width:min(78vw,300px);display:none;z-index:9}
#estado.on{display:block}
.st{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:15px}
.st i{flex:1;height:10px;background:#333;border-radius:6px;overflow:hidden}.st i b{display:block;height:100%;background:#f4a6c6;border-radius:6px}
.heart{position:fixed;font-size:22px;pointer-events:none;animation:up 1.2s forwards}
@keyframes up{to{transform:translateY(-70px);opacity:0}}
#mouth,.bl{display:none!important}
body[data-m=tickle] .eye{--ht:52%}
#panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#1b1824f2;border-radius:20px;padding:16px 20px;width:min(82vw,320px);display:none;z-index:9;max-height:80vh;overflow:auto}
#panel.on{display:block}#panel h3{margin:0 0 6px;font-size:18px}
#panel button{display:block;width:100%;margin:8px 0;background:#ffffff1a;color:#fff;border:0;border-radius:14px;padding:12px;font-size:17px}
body[data-m=surprised] .eye{transform:scale(1.18)}
body[data-m=bored] .eye{--lt:40%}
body[data-m=sick] .eye{--lt:48%;background-color:#cfe8d0}
body[data-m=dance] .eye{--ht:52%}
#acc{display:none;position:absolute;pointer-events:none;font-style:normal}
@keyframes hop{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-26px) rotate(4deg)}}
@keyframes sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes posea{0%,60%{transform:rotate(0)}70%{transform:rotate(-12deg) scale(1.1)}85%{transform:rotate(10deg) scale(1.1)}100%{transform:rotate(0)}}
@keyframes shk{0%,100%{transform:translateX(-10px)}50%{transform:translateX(10px)}}
@keyframes crz{0%{transform:rotate(0)}25%{transform:translate(20px,-14px) rotate(25deg)}50%{transform:translate(-20px,8px) rotate(-30deg) scale(1.1)}75%{transform:translate(10px,-20px) rotate(360deg)}100%{transform:rotate(360deg)}}
@keyframes flt{0%,100%{transform:translateY(-8px)}50%{transform:translateY(10px)}}
</style></head>
<body data-m="neutral">
<div id="screen"><div id="face"><div id="eyes"><div class="eye l"></div><div class="eye r"></div><i class="bl a"></i><i class="bl b"></i><b id="sym">💢</b><b id="acc"></b></div><div id="mouth"></div></div></div>
<div id="bubble"></div>
<div id="estado"></div><div id="panel"></div>
<div id="bar"><button id="bXarope" style="display:none">🍯 Xarope</button><button id="bEstado">💗 Estado</button><button id="bCuidar">🧸 Cuidar</button><button id="bBrincar">🎮 Brincar</button><button id="bMundo">✨ Mundo</button></div>
<script>
const $=id=>document.getElementById(id),body=document.body,eyes=$('eyes'),els=[...document.querySelectorAll('.eye')];
const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
// ---- estados ----
let S={energia:100,fome:100,saude:100,humor:100,last:Date.now()};
try{const s=JSON.parse(localStorage.getItem('nebula-v1')||'null');if(s)S=Object.assign(S,s)}catch(_){}
const PM={carinhosa:{pet:1.6,thr:.6},curiosa:{bored:.6},tranquila:{decay:.7,bored:1.6},brincalhona:{play:1.5,bored:.7},temperamental:{irr:2},reservada:{pet:.6}};
const thrR=()=>pm('thr')*(S.pers==='reservada'?Math.max(1,2.5-(S.bond||0)*.15):1);
const pm=(k,d=1)=>((PM[S.pers]||{})[k])??d;
function offline(m){m=Math.min(m,480);decay(m*.4);if(m>240)S.energia=Math.max(S.energia,60);['energia','fome','saude','humor'].forEach(k=>S[k]=Math.max(S[k],20))}
function decay(min){S.energia=clamp(S.energia-.4*min*pm('decay'));S.fome=clamp(S.fome-.5*min*pm('decay'));
 const extra=(S.fome<30||S.energia<30)?.3:0;S.humor=clamp(S.humor-(.3+extra+(S.sick>Date.now()?.3:0))*min);
 S.saude=clamp(S.saude+((S.fome<20||S.energia<20)?-.5:.3)*min)}
const away=(Date.now()-S.last)/60000;offline(away);S.last=Date.now();
function save(){S.last=Date.now();try{localStorage.setItem('nebula-v1',JSON.stringify(S))}catch(_){}}
setInterval(()=>{decay(5/60);sickTick();foodTick();joyTick();save();if(['neutral','sleepy','sad','sick','bored'].includes(mood))set(base(),0)},5000);
const night=()=>{const h=new Date().getHours();return h>=22||h<6};
const base=()=>S.sick>Date.now()?'sick':(night()||S.energia<20)?'sleepy':(S.humor<25||S.fome<20)?'sad':'neutral';
// ---- humor ----
let mood='neutral',mt,bt,lastAct=Date.now(),stage=0;
function say(t){const b=$('bubble');b.textContent=t;b.classList.add('on');clearTimeout(bt);bt=setTimeout(()=>b.classList.remove('on'),2600)}
const VIB={carinho:[40,60,40,60,40],angry:[220],scared:[60,40,60],dizzy:[100,50,100,50,100],cry:[80,60,80],happy:[25],tickle:[30,30,30,30,30]};
const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(_){}};
const PR={neutral:0,dance:3,bored:1,sick:1,sleepy:1,sad:1,happy:1,curious:2,carinho:2,tickle:2,surprised:2,scared:3,angry:3,dizzy:3,cry:3};let until=0;
function set(m,ms=2200,t){if(ms&&Date.now()<until&&PR[m]<PR[mood])return;if(ms){until=Date.now()+ms;if(VIB[m])vib(VIB[m])}clearTimeout(mt);mood=m;body.dataset.m=m;els.forEach(e=>e.textContent=m==='carinho'?'❤️':'');if(t)say(t);
 if(ms&&m!==base())mt=setTimeout(()=>set(base(),0),ms)}
set(base(),0);
(function(){const d=new Date(),h=d.getHours(),k=d.toDateString();if(away>(S.pers==='carinhosa'?60:180))say('Que saudade! 💗');else if(S.greet!==k&&h>=6&&h<12){S.greet=k;say('Bom dia! ☀️')}else if(night())say('Boa noite... 😴');if(!navigator.onLine)say('Sem internet... 📵')})();
function wig(){eyes.classList.add('wig');setTimeout(()=>eyes.classList.remove('wig'),1200)}
(function blink(){if(['neutral','happy','sad','curious'].includes(mood)){els.forEach(e=>e.style.setProperty('--blink',.08));setTimeout(()=>els.forEach(e=>e.style.setProperty('--blink',1)),130)}setTimeout(blink,2200+Math.random()*3000)})();
function look(x,y){eyes.style.transform=`translate(${(x/innerWidth-.5)*60}px,${(y/innerHeight-.5)*34}px)`}
function heart(x,y){const h=document.createElement('div');h.className='heart';h.textContent='💗';h.style.left=x-10+'px';h.style.top=y-10+'px';document.body.appendChild(h);setTimeout(()=>h.remove(),1200)}
// ---- tédio ----
setInterval(()=>{const s=(Date.now()-lastAct)/1000;
 if(s>40*pm('bored')&&stage<1){stage=1;set('curious',9000,'👀')}
 if(s>60*pm('bored')&&stage<2){stage=2;if(S.pers==='tranquila')set('sleepy',6000,'Zzz... 😴');else{set(S.pers==='carinhosa'?'sad':'bored',5000,S.pers==='carinhosa'?'Me faz carinho? 🥰':'Tô entediada... 🥱');S.humor=clamp(S.humor-2)}}
 if(s>120&&stage<3){stage=3;wig()}},1000);
const act=()=>{lastAct=Date.now();stage=0};
setInterval(()=>{if(Date.now()-lastAct<20000||mood!==base())return;if(S.pers==='curiosa')set('curious',4000,'👀');else if(S.pers==='brincalhona'){wig();set('happy',2000,'Hihi 😄')}},25000);
// ---- toque ----
const ptrs=new Map();let sx=null,sy=null,moved=0,petD=0,rev=0,lastDx=0,lastX=0,lastY=0,pinch0=0,multi=0,pinched=0,tMulti=0,hold,taps=[],lastTap=0,petGain=0,permAsked=0;
const dist=()=>{const p=[...ptrs.values()];return Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)};
function pet(m,t){if(mood!==m)set(m,1300,t);else{until=Date.now()+1300;clearTimeout(mt);mt=setTimeout(()=>set(base(),0),1300)}}
addEventListener('pointerdown',e=>{act();if(gOn)return;if(!permAsked){permAsked=1;askPerm().then(startSensors)}if(e.target.closest('button,#estado,#panel'))return;
 ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptrs.size===1){sx=lastX=e.clientX;sy=lastY=e.clientY;moved=0;petD=0;rev=0;multi=0;pinched=0;petGain=0;
  hold=setTimeout(()=>{if(!moved){const dx=(sx<innerWidth/2?1:-1)*40;eyes.style.transform=`translate(${dx}px,0)`;set('scared',1800,'Me solta! 😖')}},700)}
 else{clearTimeout(hold);multi=1;tMulti=Date.now();pinch0=dist()}});
addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;act();ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptrs.size===2){const d=dist();if(Math.abs(d-pinch0)>40){pinched=1;set('scared',1800,'Ai! 😨');pinch0=d}return}
 if(sx==null||multi)return;
 if(Math.hypot(e.clientX-sx,e.clientY-sy)>12){moved=1;clearTimeout(hold);look(e.clientX,e.clientY)}
 if(moved){const dx=e.clientX-lastX,dy=e.clientY-lastY;petD+=Math.hypot(dx,dy);
  if(dx*lastDx<0&&Math.abs(dx)>3)rev++;if(Math.abs(dx)>3)lastDx=dx;lastX=e.clientX;lastY=e.clientY;
  if(rev>=12){rev=0;wig();pet('tickle','Hahaha, cócegas! 🤣');if(!petGain){petGain=1;S.humor=clamp(S.humor+4)}}
  else if(petD>700*pm('thr')){pet('carinho','Ronrom... 😍');heart(e.clientX,e.clientY)}
  else if(petD>120*thrR()){pet('happy','');heart(e.clientX,e.clientY);if(!petGain){petGain=1;S.bond=(S.bond||0)+1;S.humor=clamp(S.humor+5*pm('pet'))}}}});
function up(e){clearTimeout(hold);if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
 if(multi){if(ptrs.size===0){if(!pinched&&Date.now()-tMulti<450){set('sleepy',4000,'Zzz... 😴');S.energia=clamp(S.energia+8)}multi=0;sx=null;eyes.style.transform=''}return}
 if(sx==null)return;const was=moved;sx=null;eyes.style.transform='';if(was)return;
 const t=Date.now();taps=taps.filter(x=>t-x<1100);taps.push(t);const n=taps.length;
 if(n>=(S.pers==='temperamental'?2:3)){set('angry',2500,'Para! 😠');S.humor=clamp(S.humor-3*pm('irr'));taps=[];return}
 if(n===2){set('curious',2200,'?');return}
 set('happy',1600,'');}
addEventListener('pointerup',up);addEventListener('pointercancel',up);
// ---- movimento ----
async function askPerm(){try{for(const C of [window.DeviceMotionEvent,window.DeviceOrientationEvent])if(C&&C.requestPermission)await C.requestPermission()}catch(_){}}
let cool=0,shakes=0,lastS=0,gotO=0,gotM=0;
function startSensors(){addEventListener('deviceorientation',onOri);addEventListener('devicemotion',onMot)}
let lastG=null,lastD=0,sw=0,swT=0,swCool=0;
function swayCheck(g){if(g==null)return;const t=Date.now();if(t-swT>5000){swT=t;sw=0}
 if(lastG!=null){const d=g-lastG;if(Math.abs(d)>1.5&&d*lastD<0&&Math.abs(g)<25)sw++;if(Math.abs(d)>1.5)lastD=d}lastG=g;
 if(sw>=6&&t>swCool){swCool=t+9000;sw=0;set('sleepy',5000,'Zzz... 😴');S.energia=clamp(S.energia+6)}}
const onOri=e=>{if(e.beta==null)return;gotO=1;act();if(gOn)gx=.5+clamp(e.gamma||0,-30,30)/60;swayCheck(e.gamma);
 const g=clamp(e.gamma||0,-45,45)/45,b=clamp((e.beta||0)-55,-40,40)/40;
 if(!['scared','dizzy'].includes(mood))eyes.style.transform=`translate(${g*30}px,${b*18}px)`;
 const t=Date.now();if(t<cool)return;
 if(e.beta<15){cool=t+5000;set('sleepy',3500,'Aaaah... 🥱');S.energia=clamp(S.energia+3)}
 else if(e.beta>115){cool=t+4000;set('scared',2500,'Aaah, vou cair! 😨')}};
let free=0,lastP=0,peaks=[];
const onMot=e=>{const ag=e.accelerationIncludingGravity;if(ag&&ag.x!=null){gotM=1;const G=Math.hypot(ag.x,ag.y,ag.z),t=Date.now();
 if(G<2.5){if(++free>=4){free=0;set('scared',2500,'Aaaah, tô caindo! 😱')}}else free=0;
 if(G>13&&G<22&&t-lastP>280){lastP=t;peaks=peaks.filter(x=>t-x<4000);peaks.push(t);if(peaks.length>=5){peaks=[];wig();set('curious',3000,'Vamos passear? 🚶')}}}
 const a=e.acceleration;if(a&&a.x!=null)gotM=1;let m=a&&a.x!=null?Math.hypot(a.x,a.y,a.z):0;
 if(m>11){const t=Date.now();if(t-lastS>120){lastS=t;act();if(++shakes>=3){shakes=0;
  set('dizzy',2500,'Tô tonta! 😵');setTimeout(()=>{if(S.humor>=50)set('angry',2200,'Hmpf! 😠');else set('cry',3000,'Buáá... 😢')},2600)}}}
 setTimeout(()=>shakes=0,1000)};
// ---- bateria real ----
let batOK=0;
addEventListener('offline',()=>set('sad',4000,'Sem internet... 📵'));addEventListener('online',()=>set('happy',2500,'Voltou a internet! 📶'));
if(navigator.getBattery)navigator.getBattery().then(b=>{batOK=1;let said=0;const u=()=>{if(b.level<.2&&!b.charging&&!said){said=1;say('Estou ficando sem energia...')}};u();b.onlevelchange=u}).catch(()=>{});

// ---- painéis ----
let gOn=0,gx=.5,lastTray=0;const P=$('panel');
function panel(h){P.innerHTML=h+'<button data-x="close">Fechar</button>';P.classList.add('on')}
P.onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.x==='close')P.classList.remove('on');else if(d.x==='food')foodTray();else if(d.x==='bath')startBath();else if(d.x==='xarope')xarope();else if(d.f)eat(d.f);else if(d.p)visit(d.p);else if(d.pers)choose(d.pers);else if(d.g==='f')startGame();else if(d.g==='b')startButterflies();else if(d.x==='dance'){P.classList.remove('on');startDance(10)}};
const FOODS=['🍎','🍓','🥒','🍌'],rnd=a=>a[Math.random()*a.length|0];
function prefs(){const c=Object.keys(S.food||{}).filter(k=>S.food[k]>2);
 if(!S.pref||Date.now()>S.pref.until)S.pref=c.length?{f:rnd(c),until:Date.now()+6048e5}:null;
 if(!S.dis||(S.pref&&S.dis===S.pref.f))S.dis=rnd(FOODS.filter(x=>!S.pref||x!==S.pref.f))}
function foodTray(){panel('<h3>🍽️ Comida</h3>'+FOODS.map(f=>`<button data-f="${f}">${f}</button>`).join(''))}
function eat(f){P.classList.remove('on');S.food=S.food||{};S.food[f]=(S.food[f]||0)+1;prefs();
 const full=S.fome>85;S.fome=clamp(S.fome+(f===S.dis?10:25)*(full?.4:1));
 if(S.pref&&f===S.pref.f){S.humor=clamp(S.humor+8);set('happy',2500,'Adoro! '+f);wig()}
 else if(f===S.dis){S.humor=clamp(S.humor-2);set('sad',2000,'Eca... 🤢')}
 else{S.humor=clamp(S.humor+2);set('happy',2000,'Nham! '+f)}save()}
function startGame(){P.classList.remove('on');const c=document.createElement('canvas');c.width=innerWidth;c.height=innerHeight;c.style.cssText='position:fixed;inset:0;z-index:8;background:#000d';document.body.appendChild(c);
 const x=c.getContext('2d');let fr=[],score=0,t0=Date.now(),last=t0;gOn=1;c.onpointermove=e=>gx=e.clientX/innerWidth;
 const iv=setInterval(()=>{const n=Date.now(),dt=(n-last)/1000;last=n;x.clearRect(0,0,c.width,c.height);
  if(Math.random()<.05)fr.push({x:Math.random(),y:0,e:Math.random()<.06?'🍰':rnd(['🍎','🍓','🍌'])});
  x.font='34px serif';x.textAlign='center';fr.forEach(f=>{f.y+=dt*(f.e==='🍰'?330:220);x.fillText(f.e,f.x*c.width,f.y)});
  const by=c.height-90,bx=gx*c.width;x.fillText('🧺',bx,by+20);
  fr=fr.filter(f=>{if(f.y>by-10&&f.y<by+30&&Math.abs(f.x*c.width-bx)<45){score+=f.e==='🍰'?5:1;if(f.e==='🍰'){say('Docinho! 🍰✨');vib([40,30,80])}return false}return f.y<c.height});
  x.font='20px sans-serif';x.fillStyle='#fff';x.fillText('🍎 '+score+'   ⏱ '+Math.max(0,20-Math.round((n-t0)/1000)),c.width/2,50);
  if(n-t0>20000){clearInterval(iv);c.remove();gOn=0;S.humor=clamp(S.humor+Math.min(25,score*3*pm('play')));S.energia=clamp(S.energia-4);say('Fez '+score+' pontos! 🏆');if(score>=10)startDance(7);else{set('happy',3500);wig()}save()}},33)}
const PL={'🌳 Praça':'praca','🌱 Jardim':'jardim','🎪 Eventos':'eventos'};
function mundo(){if(S.sick>Date.now()){say('Tô gripada... 🤧');return}
 panel('<h3>✨ Nébula City</h3>'+Object.keys(PL).map(k=>`<button data-p="${PL[k]}">${k}</button>`).join('')+`<div style="font-size:14px;opacity:.7">Descobertas: ${(S.mem||[]).join(' ')||'nada ainda'}</div>`)}
function visit(p){P.classList.remove('on');S.places=S.places||{};S.mem=(S.mem||[]).slice(-11);
 if(!S.places[p]){S.places[p]=1;set('curious',4500,'Que lugar novo! 👀')}else set('happy',2000,'Conheço aqui!');
 const it=Math.random()<(S.pers==='curiosa'?.4:.2)?'🎁':rnd(['🌱','🪨','✨','🛸']);
 setTimeout(()=>{if(it==='🎁'){const g=rnd(['💎','🧸','🌟']);S.mem.push(g);S.humor=clamp(S.humor+6);set('surprised',1300,'!?');setTimeout(()=>{say('Um presente! '+g);startDance(6)},1400)}else{S.mem.push(it);say('Achei '+it);if(Math.random()<.25)startDance(5)}save()},2500)}
const PERS=['🥰 carinhosa','🧐 curiosa','😴 tranquila','😂 brincalhona','😤 temperamental','😶 reservada'];
function persPanel(){panel('<h3>Como será a Nébula?</h3>'+PERS.map(p=>`<button data-pers="${p.split(' ')[1]}">${p}</button>`).join('')+'<button data-pers="sorteio">🎲 Surpresa</button>');P.lastChild.remove()}
function choose(k){if(k==='sorteio')k=rnd(PERS).split(' ')[1];S.pers=k;P.classList.remove('on');say('Eu sou '+k+'! ✨');save()}
function sickTick(){const n=Date.now();
 if(S.sick&&S.sick<=n){S.sick=0;say('Passou! 😊');set('happy',2500)}
 else if(!S.sick&&!gOn&&Math.random()<.0006){S.sick=n+4*60000;say('Atchim! 🤧 🌡️ 37,8');set('sick',0)}
 $('bXarope').style.display=S.sick>n?'':'none'}
function foodTick(){const n=Date.now();if(S.fome<40&&n-lastTray>300000&&!gOn&&!P.classList.contains('on')&&S.pers){lastTray=n;say('Tô com fome... 🍽️');foodTray()}}
function xarope(){P.classList.remove('on');S.sick=0;S.saude=clamp(S.saude+20);set('sleepy',3000,'Glug... zzz 😴');setTimeout(()=>set('happy',2500,'Melhorei! 😊'),3200);$('bXarope').style.display='none';save()}
$('bXarope').onclick=xarope;
prefs();if(!S.pers)setTimeout(persPanel,800);
const STY={festa:['🪩','hop .35s','top:-50%;left:50%;transform:translateX(-50%)','Festa! 🪩'],fofa:['🎀','sway 1.3s','top:-42%;right:6%','Dancinha fofa 🥰'],estrela:['🕶️','posea 1.8s','top:-2%;left:50%;transform:translateX(-50%);font-size:calc(var(--ew)*2)','Show! 😎'],chocalho:['🪇','shk .25s','top:25%;left:104%','Chocalho! 🎶'],maluquinha:['🎉','crz 1.4s','top:-50%;left:50%;transform:translateX(-50%)','Maluquinha! 🤪'],calminha:['🌙','flt 3s','top:-45%;left:-4%','Calminha... 🌙']};
const DW={carinhosa:{fofa:5,calminha:2},tranquila:{calminha:6,fofa:2},brincalhona:{maluquinha:5,chocalho:5,festa:2},temperamental:{estrela:4,festa:3},reservada:{calminha:3,fofa:2}};
function pickStyle(){const w=Object.assign({festa:1,fofa:1,estrela:1,chocalho:1,maluquinha:1,calminha:1},DW[S.pers]||{});let pool=[];for(const k in w)for(let i=0;i<w[k];i++)pool.push(k);
 if(S.pers==='curiosa')pool=pool.filter(k=>k!==S.lastDance);const k=rnd(pool);S.lastDance=k;return k}
let dancing=0;
function startDance(sec=10){if(dancing||gOn)return;dancing=1;const k=pickStyle(),st=STY[k],first=S.pers==='reservada'?STY.calminha:st,acc=$('acc');
 const apply=x=>{eyes.style.transform='';eyes.style.animation=x[1]+' ease-in-out infinite';acc.textContent=x[0];acc.style.cssText='display:block;position:absolute;pointer-events:none;font-size:calc(var(--ew)*.55);font-style:normal;'+x[2]};
 set('dance',sec*1000,st[3]);vib(Array(sec).fill(60).flatMap(v=>[v,140]));apply(first);if(first!==st)setTimeout(()=>apply(st),4000);
 setTimeout(()=>{eyes.style.animation='';acc.style.display='none';dancing=0;S.humor=clamp(S.humor+3);if(S.pers==='temperamental')set('angry',1500,'Ta-dá! 😤');save()},sec*1000)}
function joyTick(){if(S.humor>=99&&mood==='neutral'&&!gOn&&Math.random()<.01)startDance(5)}
function startButterflies(){P.classList.remove('on');gOn=1;const c=document.createElement('canvas');c.width=innerWidth;c.height=innerHeight;c.style.cssText='position:fixed;inset:0;z-index:8;background:#000a';document.body.appendChild(c);
 const x=c.getContext('2d');let bf=[],fx=[],score=0,t0=Date.now(),last=t0,sp=0;
 c.onpointerdown=e=>{const i=bf.findIndex(b=>Math.hypot(b.x-e.clientX,b.y-e.clientY)<55);if(i>=0){fx.push({x:bf[i].x,y:bf[i].y,t:0});bf.splice(i,1);score++;vib(20)}};
 const iv=setInterval(()=>{const n=Date.now(),dt=(n-last)/1000;last=n;sp-=dt;
  if(sp<=0&&bf.length<6){sp=.7+Math.random()*.6;const ty=rnd(['lenta','rapida','zig','curva','breve']),L=Math.random()<.5;bf.push({x:L?-20:c.width+20,y:60+Math.random()*(c.height-200),vx:(L?1:-1)*({lenta:45,rapida:130}[ty]||80),vy:0,ty,t:0,life:ty==='breve'?2.6:99})}
  x.clearRect(0,0,c.width,c.height);x.textAlign='center';x.font='42px serif';
  bf=bf.filter(b=>{b.t+=dt;if(b.ty==='zig'&&Math.random()<dt*1.8)b.vy=(Math.random()-.5)*160;if(b.ty==='curva')b.vy=Math.sin(b.t*3)*90;
   b.x+=b.vx*dt;b.y=Math.max(40,Math.min(c.height-100,b.y+b.vy*dt));x.fillText('🦋',b.x,b.y);return b.t<b.life&&b.x>-40&&b.x<c.width+40});
  fx=fx.filter(f=>{f.t+=dt;x.globalAlpha=Math.max(0,1-f.t*2.5);x.fillText('✨',f.x,f.y-f.t*40);x.globalAlpha=1;return f.t<.4});
  x.font='20px sans-serif';x.fillStyle='#fff';x.fillText('🦋 '+score+'   ⏱ '+Math.max(0,25-Math.round((n-t0)/1000)),c.width/2,50);
  if(n-t0>25000){clearInterval(iv);c.remove();gOn=0;S.humor=clamp(S.humor+Math.min(25,score*3*pm('play')));S.energia=clamp(S.energia-4);say('Capturou '+score+' 🦋✨');if(score>=8)startDance(6);else set('happy',3000);save()}},33)}
function startBath(){P.classList.remove('on');gOn=1;const c=document.createElement('canvas');c.width=innerWidth;c.height=innerHeight;c.style.cssText='position:fixed;inset:0;z-index:8';
 const bar=document.createElement('div');bar.style.cssText='position:fixed;z-index:9;left:0;right:0;bottom:24px;text-align:center';
 const b=document.createElement('button');b.style.cssText='background:#ffffff26;color:#fff;border:0;border-radius:22px;padding:12px 22px;font-size:17px';b.textContent='🧼 Pegar o sabonete';bar.appendChild(b);
 document.body.append(c,bar);const x=c.getContext('2d');let step=0,foam=[],down=0;say('Hora do banho! 🛁');
 const draw=()=>{x.clearRect(0,0,c.width,c.height);foam.forEach(f=>{x.beginPath();x.arc(f.x,f.y,f.r,0,7);x.fillStyle='rgba(255,255,255,.78)';x.fill()})};
 b.onclick=()=>{if(step===0){step=1;b.style.display='none';say('Arraste o dedo para esfregar 🫧')}else if(step===2){step=3;b.style.display='none';say('Agora enxágue arrastando 🚿')}};
 c.onpointerdown=()=>down=1;c.onpointerup=c.onpointercancel=()=>down=0;
 c.onpointermove=e=>{if(!down||step<1||step===2)return;const px=e.clientX,py=e.clientY;
  if(step===1){foam.push({x:px+Math.random()*30-15,y:py+Math.random()*30-15,r:14+Math.random()*16});set('sleepy',1500,foam.length===1?'Aaah, que gostoso... 😌':'');
   if(foam.length>=70){step=2;b.textContent='🚿 Enxaguar';b.style.display=''}}
  else if(step===3){foam=foam.filter(f=>Math.hypot(f.x-px,f.y-py)>55);
   if(!foam.length){c.remove();bar.remove();gOn=0;S.humor=clamp(S.humor+8);S.saude=clamp(S.saude+3);say('Limpinha! ✨');startDance(6);setTimeout(()=>set('carinho',2500,'🥰'),6200);save();return}}
  draw()}}

 $('estado').innerHTML=rows.map(r=>`<div class="st"><span>${r[0]}</span><i><b style="width:${Math.round(r[2])}%"></b></i><span>${Math.round(r[2])}%</span></div>`).join('')+`<div class="st" style="font-size:12px;opacity:.7">Sensores: inclinar ${gotO?'✅':'❌'} · mexer ${gotM?'✅':'❌'} · vibrar ${navigator.vibrate?'✅':'❌'} · bateria ${batOK?'✅':'❌'}</div>`}
